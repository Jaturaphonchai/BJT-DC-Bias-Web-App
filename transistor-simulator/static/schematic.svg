<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-labelledby="sch-title sch-desc">
  <title id="sch-title">วงจร BJT NPN Common-Emitter แบบ Voltage-Divider Bias</title>
  <desc id="sch-desc">R1 ต่อจาก VCC ไป Base, R2 ต่อจาก Base ลง Ground, RC ต่อจาก VCC ไป Collector และ RE ต่อจาก Emitter ลง Ground พร้อมจุดวัด VB, VC, VE</desc>

  <defs>
    <marker id="npn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#123658"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#f7faff"/>

  <!-- VCC rail -->
  <line x1="100" y1="45" x2="340" y2="45" stroke="#123658" stroke-width="2"/>
  <circle cx="100" cy="45" r="3.5" fill="#123658"/>
  <text x="94" y="34" font-family="Tahoma, Arial, sans-serif" font-size="14" font-weight="700" fill="#14405f">VCC</text>

  <!-- ground rail -->
  <line x1="170" y1="370" x2="340" y2="370" stroke="#123658" stroke-width="2"/>
  <line x1="255" y1="370" x2="255" y2="382" stroke="#123658" stroke-width="2"/>
  <line x1="241" y1="382" x2="269" y2="382" stroke="#123658" stroke-width="2"/>
  <line x1="247" y1="389" x2="263" y2="389" stroke="#123658" stroke-width="2"/>
  <line x1="253" y1="395" x2="257" y2="395" stroke="#123658" stroke-width="2"/>
  <text x="278" y="392" font-family="Tahoma, Arial, sans-serif" font-size="13" fill="#546d83">GND</text>

  <!-- R1 : VCC -> base node -->
  <line x1="170" y1="45" x2="170" y2="105" stroke="#123658" stroke-width="2"/>
  <rect x="157" y="105" width="26" height="60" fill="#ffffff" stroke="#123658" stroke-width="2"/>
  <line x1="170" y1="165" x2="170" y2="200" stroke="#123658" stroke-width="2"/>
  <text x="186" y="142" font-family="Tahoma, Arial, sans-serif" font-size="14" font-weight="700" fill="#14405f">R1</text>

  <!-- R2 : base node -> ground -->
  <line x1="170" y1="200" x2="170" y2="240" stroke="#123658" stroke-width="2"/>
  <rect x="157" y="240" width="26" height="60" fill="#ffffff" stroke="#123658" stroke-width="2"/>
  <line x1="170" y1="300" x2="170" y2="370" stroke="#123658" stroke-width="2"/>
  <text x="186" y="277" font-family="Tahoma, Arial, sans-serif" font-size="14" font-weight="700" fill="#14405f">R2</text>

  <!-- base node wire -->
  <circle cx="170" cy="200" r="3.5" fill="#123658"/>
  <line x1="170" y1="200" x2="300" y2="200" stroke="#123658" stroke-width="2"/>

  <!-- transistor body -->
  <circle cx="312" cy="200" r="44" fill="none" stroke="#8aa6bd" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="300" y1="170" x2="300" y2="230" stroke="#123658" stroke-width="3.2"/>

  <!-- collector -->
  <line x1="300" y1="176" x2="340" y2="150" stroke="#123658" stroke-width="2"/>
  <line x1="340" y1="150" x2="340" y2="115" stroke="#123658" stroke-width="2"/>

  <!-- emitter (with NPN arrow) -->
  <line x1="300" y1="224" x2="340" y2="252" stroke="#123658" stroke-width="2" marker-end="url(#npn-arrow)"/>
  <line x1="340" y1="252" x2="340" y2="275" stroke="#123658" stroke-width="2"/>

  <!-- RC : VCC -> collector -->
  <line x1="340" y1="45" x2="340" y2="55" stroke="#123658" stroke-width="2"/>
  <rect x="327" y="55" width="26" height="60" fill="#ffffff" stroke="#123658" stroke-width="2"/>
  <text x="357" y="90" font-family="Tahoma, Arial, sans-serif" font-size="14" font-weight="700" fill="#14405f">RC</text>

  <!-- RE : emitter -> ground -->
  <rect x="327" y="275" width="26" height="60" fill="#ffffff" stroke="#123658" stroke-width="2"/>
  <line x1="340" y1="335" x2="340" y2="370" stroke="#123658" stroke-width="2"/>
  <text x="357" y="310" font-family="Tahoma, Arial, sans-serif" font-size="14" font-weight="700" fill="#14405f">RE</text>

  <!-- node labels -->
  <text x="222" y="188" font-family="Tahoma, Arial, sans-serif" font-size="14" font-weight="700" fill="#0c8078">V<tspan baseline-shift="sub" font-size="10">B</tspan></text>
  <text x="350" y="140" font-family="Tahoma, Arial, sans-serif" font-size="14" font-weight="700" fill="#0c8078">V<tspan baseline-shift="sub" font-size="10">C</tspan></text>
  <text x="350" y="270" font-family="Tahoma, Arial, sans-serif" font-size="14" font-weight="700" fill="#0c8078">V<tspan baseline-shift="sub" font-size="10">E</tspan></text>

  <!-- transistor label -->
  <text x="270" y="258" font-family="Tahoma, Arial, sans-serif" font-size="13" font-weight="700" fill="#14405f">Q1</text>
  <text x="262" y="274" font-family="Tahoma, Arial, sans-serif" font-size="11" fill="#546d83">NPN</text>
</svg>
